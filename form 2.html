<!DOCTYPE html>
<html>
<head>
    <title>Form 2</title>
</head>
<body>

	<div id="formContainer">
		<div id="formFrame">
			<form id="submitForm"
			  action="https://script.google.com/macros/s/AKfycbyuxkWD0SKiUQDmKsmS82_y1afhwmrmREKbxaDZOEoF-ORL0qIvdpBW5L_jQB6SZ6UPXQ/exec"
			>
				<div id="entryForm">
					<div name="formTitleFrame">
						<h2 name="formTitle">Sign Up Form</h2>
					</div>
					<div class="formField">
						<label for="Name">Enter Your Name:</label>
						<input name="Name" type="text" placeholder="Name" required>
					</div>
					<div class="formField">
						<label for="Bringing">What Are You Bringing:</label>
						<input name="Bringing" type="text" placeholder="Item to Bring" required>
					</div>
					<div id="submitText">
						<label>Submitting....</label>
					</div>
				</div>
				<div id="buttonDiv">
					<button type="submit">Send</button>
					<button type="reset">Clear Form</button>
				</div>
			</form>
		</div>
	</div>
	
</body>
</html>

<style>
	body{
		background-color: black;
		background-image: url("https://raw.githubusercontent.com/jac21984/Halloween/main/media/background/background-01.svg");
		width: 100vw;
		height: 100vh;
	}
	
	#formContainer {
		width: 100%;
		height: 100%;
		
		display: flex;
		position: absolute;
		flex-direction: row;
		justify-content: center;
		
		top: 35vh;
		left: 0;
		bottom: 0;
	}
	
	#formFrame {
		background-color: white;
		display:flex;
		flex-direction: row;
		justify-content: center;
		align-items: center;
		
		width: 400px;
		height: 200px;
		border-radius: 25px;
		box-shadow: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23), 0 0 10px rgba(0,0,0,1) inset;
		
	}
	
	#formTitle{
		padding: 5px;
	}
	
	#entryForm {
		display: flex;
		flex-direction: column;
		align-items: center;	
	}
	
	#submitForm {
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
	}
	
	#submitText {
		visibility: hidden;
	}
	
	
</style>

<script>

	window.addEventListener("load", function() {
	  const form = document.getElementById('submitForm');
	  const submitText = document.getElementById("submitText");
	  form.addEventListener("submit", function(e) {
		e.preventDefault();
		const data = new FormData(form);
		const action = e.target.action;
		
		submitText.style.visibility = "visible";
		
		fetch(action, {
		  method: 'POST',
		  body: data,
		})
		.then(() => {
		  //alert("Success!");
		  form.reset();
		  submitText.style.visibility = "hidden";
		})
	  });
	});
	
</script>
